name: Self-Healing Watchdog

# Runs on GitHub's cloud every 10 minutes — no local computer needed.
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: self-heal
  cancel-in-progress: false

jobs:
  watchdog:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Probe, restart, rollback, diagnose
        id: heal
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
        run: bash .github/scripts/self-heal.sh

      - name: Publish summary
        if: always()
        run: |
          if [ -s heal-report.md ]; then cat heal-report.md >> "$GITHUB_STEP_SUMMARY"
          else echo "✅ All services healthy" >> "$GITHUB_STEP_SUMMARY"; fi

      - name: Open or update incident issue
        if: always() && steps.heal.outputs.incident == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('heal-report.md', 'utf8') +
              `\n\n[Workflow run](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})`;
            const healed = '${{ steps.heal.outputs.healthy }}' === 'true';
            const label = 'auto-heal';
            try { await github.rest.issues.createLabel({ ...context.repo, name: label, color: 'd73a4a' }); } catch (e) {}
            const { data: open } = await github.rest.issues.listForRepo({ ...context.repo, labels: label, state: 'open' });
            if (open.length) {
              await github.rest.issues.createComment({ ...context.repo, issue_number: open[0].number, body });
              if (healed && !body.includes('rollback')) {
                await github.rest.issues.update({ ...context.repo, issue_number: open[0].number, state: 'closed' });
              }
            } else {
              await github.rest.issues.create({
                ...context.repo,
                title: `${healed ? '♻️ Auto-healed' : '🚨 Production DOWN'}: incident ${new Date().toISOString().slice(0,16)}Z`,
                labels: [label],
                body,
              });
            }

