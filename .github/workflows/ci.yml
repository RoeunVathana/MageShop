name: MegaCommerce CI Pipeline

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security-audit:
    name: Enterprise 12-Gate Security Audit (OWASP & Railway Hardening)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4
      - name: Execute 12-Gate Security Audit Script
        run: bash ./security-audit.sh

  backend:
    name: Backend CI (PHP 8.2 • PostgreSQL • Redis • PHPUnit)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: megacommerce_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Set up PHP 8.2 & Extensions
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, xml, ctype, iconv, intl, pdo, pdo_pgsql, pgsql, bcmath, pcntl, gd, zip, redis
          coverage: none

      - name: Locate Composer Cache Directory
        id: composer-cache
        working-directory: backend
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache Composer Dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('backend/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Install Composer Dependencies
        working-directory: backend
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Check Code Style (Laravel Pint)
        working-directory: backend
        run: ./vendor/bin/pint --test

      - name: Prepare Testing Environment
        working-directory: backend
        run: |
          cp .env.ci .env
          php artisan key:generate --force

      - name: Run Database Migrations
        working-directory: backend
        run: php artisan migrate --force

      - name: Run Database Seeders
        working-directory: backend
        run: php artisan db:seed --force

      - name: Run PHPUnit Test Suite
        working-directory: backend
        run: php artisan test --colors=always

  frontend:
    name: Frontend CI (Node 20 • TypeScript • Oxlint • Vite Build)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install NPM Dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint Source Code (Oxlint)
        working-directory: frontend
        run: npm run lint

      - name: TypeScript Type-Check
        working-directory: frontend
        run: npx tsc -b

      - name: Build Production Frontend Assets
        working-directory: frontend
        env:
          VITE_API_BASE_URL: https://api.tyushop.blog/api/v1
          VITE_APP_URL: https://tyushop.blog
        run: npm run build

  docker-validation:
    name: Docker Build Validation (Backend & Frontend Images)
    runs-on: ubuntu-latest
    needs: [backend, frontend]

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Validate Backend Docker Build
        uses: docker/build-push-action@v5
        with:
          context: .
          file: backend/Dockerfile
          push: false
          tags: megacommerce-backend:ci-test

      - name: Validate Frontend Docker Build
        uses: docker/build-push-action@v5
        with:
          context: .
          file: frontend/Dockerfile
          push: false
          tags: megacommerce-frontend:ci-test

